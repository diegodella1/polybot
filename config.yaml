# === Position sizing ===
# Conservative: 5% base, 8% max → $1.00-$1.60 per trade on $20 bankroll
base_trade_pct: 0.05
max_trade_pct: 0.08
min_trade_usd: 1
max_exposure_usd: 5

# === Entry filters ===
# Only trade near-50/50 markets (sweet spot for binary options)
min_entry_price: 0.42
max_entry_price: 0.58
trade_threshold: 0.10
max_spread_cents: 5
min_time_remaining_sec: 90

# === Stop-loss / Take-profit ===
# Wider SL (binary market bids bounce a lot), faster TP
stop_loss_pct: 0.15
take_profit_pct: 0.10

# === Risk management ===
daily_loss_limit_pct: 0.15
max_consecutive_losses: 3
cooldown_rounds: 8
kelly_fraction: 0.5

# === Circuit breaker ===
# Lower threshold temporarily — old trades (bad config) poison the window
# Once we have 30+ trades with new config, raise back to 0.40
min_win_rate: 0.30
circuit_breaker_window: 30
circuit_breaker_hours: 2

# === Signal weights ===
# Reduce fair_value (too noisy), boost momentum + book_skew (more reliable)
# Enable sentiment at 0.05 for directional bias
weights:
  momentum: 0.35
  book_skew: 0.25
  fair_value: 0.10
  vol_regime: 0.10
  rag_pattern: 0.15
  sentiment: 0.05

# === Estimated win-rate bounds (Kelly input) ===
min_estimated_winrate: 0.52
max_estimated_winrate: 0.60

# === Mode ===
dry_run: false

# === Misc ===
daily_profit_target_pct: 0.10
binance_symbol: btcusdt
telegram_enabled: true
bot_enabled: true
